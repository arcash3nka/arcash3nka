<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="300" height="400" viewBox="0 0 300 400" role="img" aria-label="arc-exam-sprint — 11-day exam sprint, planned day by day"><title>arc-exam-sprint — 11-day exam sprint, planned day by day</title>
<style>
  .sans { font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Inter, Roboto, Helvetica, Arial, sans-serif; }
